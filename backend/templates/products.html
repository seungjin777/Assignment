<!--
2단계: 상품 목록을 HTML로 보여주는 예시 페이지입니다.
실제 데이터는 FastAPI에서 받아와서 렌더링해야 합니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
</head>
<body>
    <h1>상품 목록</h1>
    <!-- 상품 리스트를 여기에 출력 -->
    {# 예시: {% for product in products %} <li>{{ product.name }}</li> {% endfor %} #}

    {% for product in products %} 
    <li>{{ product.name }}</li> 
    {% endfor %}
    
    <a href="/">메인으로</a>
</body>
</html>
